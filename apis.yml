  detail: >-
    WaveBL's only public API documentation was a single help-centre article stating that its
    platform complies with the DCSA eBL Issuance and Surrender Response APIs; that Zendesk help
    centre has been decommissioned and support.wavebl.com now fails the TLS handshake outright,
    while its replacement — the Salesforce Experience Cloud community at wsupport.wavebl.com —
    serves an article sitemap that 404s and answers 401 on every non-public path, so integration
    material is now reachable only by signed-in customers and partners.
