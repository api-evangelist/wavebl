aid: wavebl
name: WaveBL
description: >-
  WaveBL is an Israeli digital trade platform, headquartered in Kfar Saba and founded out of
  the ZIM shipping group, that moves original electronic bills of lading (eBLs) and the trade
  documents around them between carriers, freight forwarders, cargo owners, customs brokers and
  banks. Its blockchain-backed, peer-to-peer network issues, endorses, transfers, amends and
  surrenders title documents without a central repository, and is sold as the WaveBL Digital
  Document Hub, electronic Master and House Bills of Lading, WaveBL for Customs and a trade
  finance module that presents structured documents to banks. It is used by MSC, ZIM,
  Hapag-Lloyd, ONE, PIL, Evergreen and Leschaco among others, is approved by the International
  Group of P&I Clubs, and has implemented the DCSA Standard Annex for eBL Platform
  Interoperability so eBLs can cross to other platforms. WaveBL runs a real API programme — it
  states publicly that its platform complies with the DCSA OpenAPI specification for Issuance
  and the DCSA eBL Surrender Response API — but it operates no developer portal, publishes no
  API reference, base URL or machine-readable specification, and its only public API article
  lived on a Zendesk help centre that has since been decommissioned.
